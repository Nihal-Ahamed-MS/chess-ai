version: "0.5"

processes:
  game-server-build:
    command: cargo build --release
    working_dir: ./game-server
    is_foreground: false

  game-server:
    command: ./game-server/target/release/chess-rust-service
    working_dir: .
    environment:
      - DATABASE_URL=postgres://localhost:5432/chess-llm-service
    depends_on:
      game-server-build:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: localhost
        port: 8080
        path: /health
      initial_delay_seconds: 1
      period_seconds: 3
      failure_threshold: 5

  nextjs:
    command: npm run dev
    working_dir: .
    environment:
      - NODE_ENV=development
    depends_on:
      game-server:
        condition: process_healthy
