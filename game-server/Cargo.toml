[package]
name = "chess-rust-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"
futures = "0.3.32"
futures-util = "0.3.32"
serde = "1.0.228"
serde_json = "1.0.149"
shakmaty = "0.30.0"
sql = "0.4.3"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros", "json"] }
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
